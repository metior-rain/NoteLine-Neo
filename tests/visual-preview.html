<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteLine · 视觉验证</title><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/cartoon.css"><link rel="stylesheet" href="../src/controls.css"><link rel="stylesheet" href="../src/theme.css"><body class="player" data-screen="game"><canvas id="field" aria-label="双押连线预览"></canvas><section id="result-overlay" class="soft-overlay"></section><script type="module">
import {initResults,showResults} from '../src/results.js';
import {summarizeResult} from '../src/result-summary.js';
import {RhythmSession,normalizeChart} from '../src/engine.js';
import {GameRenderer} from '../runtime/game-renderer.js';
const notes=Array.from({length:120},(_,i)=>({lane:i%4,time:1000+i*500,...(i%6===0?{end:1300+i*500}:{})}));
const chart=normalizeChart({name:'Colorful Journey',bpm:120,duration:63000,notes});const session=new RhythmSession(chart);for(let i=0;i<session.notes.length;i++){const n=session.notes[i];if(i===30){n.reason='early';session.judge(n,'miss',-180);}else session.judge(n,i===85?'miss':i%19===0?'great':'perfect',i%19===0?60:12);}const summary=summarizeResult(session,{songId:'preview',difficulty:'normal',records:[{songId:'preview',difficulty:'normal',score:960000}]});const root=document.querySelector('#result-overlay');initResults(root);showResults(root,summary,{song:{name:'Colorful Journey',charts:{normal:chart}},difficulty:'normal',speed:1,offset:0});
const renderer=await GameRenderer.create(document.querySelector('#field'));const game={notes:[{lane:0,time:1000},{lane:2,time:1000},{lane:1,time:1450},{lane:3,time:1450,end:1900},{lane:0,time:1900},{lane:1,time:1900},{lane:2,time:1900},{lane:3,time:1900}],holds:[]};function render(){const w=innerWidth,h=innerHeight,trackWidth=Math.min(680,w-38);renderer.resize({w,h,left:(w-trackWidth)/2,trackWidth,hitY:h*.77,topY:60});renderer.draw(1000,500,game,'paused',Array.from({length:4},()=>new Set()),1);}render();onresize=render;document.querySelector('#result-close').onclick=()=>{root.hidden=true;};document.querySelector('#retry').onclick=()=>showResults(root,summary,{song:{name:'Colorful Journey',charts:{normal:chart}},difficulty:'normal',speed:1,offset:0});
</script></body></html>
