<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>NoteLine · 命中效果</title><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/theme.css"><style>body{margin:0;background:#f6faff;font-family:system-ui}main{display:flex;gap:24px;padding:32px}section{position:relative;background:white;border-radius:28px;width:46vw;height:650px;overflow:hidden;border:1px solid #dce8ef}h2,p{position:absolute;left:24px;z-index:2}h2{top:8px}p{top:54px;color:#718398}canvas{display:block}</style><body><main><section><h2>流星 · 3 COMBO</h2><p>头部 + 两次变轨 · 完成时缩放淡出</p><canvas id="meteor"></canvas></section><section><h2>弹跳 · 3 COMBO</h2><p>每个落点独立计数 · 命中扩散淡出</p><canvas id="bounce"></canvas></section></main><script type="module">
import {RhythmSession,normalizeChart} from '../src/engine.js';import {GameRenderer} from '../runtime/game-renderer.js';
for(const kind of ['meteor','bounce']){const canvas=document.querySelector('#'+kind),r=await GameRenderer.create(canvas),rect=canvas.parentElement.getBoundingClientRect();r.resize({w:rect.width,h:650,left:32,trackWidth:rect.width-64,topY:110,hitY:440});const s=new RhythmSession(normalizeChart({duration:4000,notes:[{kind,lane:0,time:1000,end:3000,path:[{lane:1,time:2000},{lane:2,time:3000}]}]}));s.auto(2999);s.auto(3000).forEach(result=>r.feedback(result));for(let frame=0;frame<=6;frame++)r.draw(1000+frame*20,3000,s,'playing',Array.from({length:4},()=>new Set()),1);}
</script></body></html>
