<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteLine · 流星与弹跳</title><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/cartoon.css"><link rel="stylesheet" href="../src/controls.css"><link rel="stylesheet" href="../src/theme.css"><style>body{margin:0}main{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:90px 32px 32px}section{position:relative;border-radius:30px;background:#ffffff99;border:1px solid #fff;overflow:hidden}canvas{width:100%;height:100%}header{position:fixed;left:40px;top:20px;display:flex;align-items:center;gap:24px}h2{position:absolute;top:20px;left:24px;margin:0;font-size:22px}p{position:absolute;top:48px;left:24px;color:#7b869e;font-size:13px}button{padding:12px 20px}</style><body class="player"><header><b>NoteLine / 新音符</b><button id="toggle" class="pill-button">播放演示</button><button id="approach" class="pill-button">查看入场</button><span id="time">2.25 s</span></header><main><section><h2>✦ 流星</h2><p>沿轨道保持 · 到变轨点平滑切换</p><output id="meteor-combo" style="position:absolute;right:24px;top:24px;font-weight:800"></output><canvas id="meteor"></canvas></section><section><h2>↝ 弹跳</h2><p>沿判定线弹跳 · 每次落点点击</p><output id="bounce-combo" style="position:absolute;right:24px;top:24px;font-weight:800"></output><canvas id="bounce"></canvas></section></main><script type="module">
import {GameRenderer} from '../runtime/game-renderer.js';import {RhythmSession,normalizeChart} from '../src/engine.js';
const make=kind=>normalizeChart({name:kind,bpm:120,duration:8000,notes:[{kind,lane:0,time:1000,end:5000,path:[{lane:1,time:2000},{lane:2,time:3000},{lane:3,time:4000},{lane:1,time:5000}]}]});
const panels=await Promise.all(['meteor','bounce'].map(async kind=>{const canvas=document.querySelector('#'+kind),renderer=await GameRenderer.create(canvas),chart=make(kind);const resize=()=>{const r=canvas.parentElement.getBoundingClientRect();renderer.resize({w:r.width,h:r.height,left:24,trackWidth:r.width-48,topY:100,hitY:r.height-80});};new ResizeObserver(resize).observe(canvas.parentElement);resize();return {kind,renderer,chart,session:new RhythmSession(chart)};}));
let playing=false,time=2250,last=0;document.querySelector('#approach').onclick=()=>{playing=false;time=400;document.querySelector('#toggle').textContent='播放演示';for(const p of panels){p.session=new RhythmSession(p.chart);p.renderer.reset();}};document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'暂停演示':'播放演示';};function frame(now){if(playing&&last)time+=(now-last);last=now;if(time>5700){time=0;for(const p of panels){p.session=new RhythmSession(p.chart);p.renderer.reset();}}for(const p of panels){p.session.auto(time).forEach(r=>{if(playing)p.renderer.feedback(r);});document.querySelector('#'+p.kind+'-combo').textContent=p.session.combo+' COMBO';p.renderer.draw(now,time,p.session,playing?'playing':'paused',Array.from({length:4},()=>new Set()),1);}document.querySelector('#time').textContent=(time/1000).toFixed(2)+' s';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
