<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4fa"><title>NoteLine · play</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2"><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="src/cartoon.css"><link rel="stylesheet" href="src/controls.css"><link rel="stylesheet" href="src/theme.css"></head><body class="player" data-screen="welcome">
<main id="welcome"><div class="welcome-wordmark"><span class="logo-lines"><i></i><i></i><i></i><i></i></span><h1>NoteLine<span>.</span></h1></div><p>四个按键，一段节奏。</p><button id="enter-menu" class="pill-button">开始<span data-icon="arrow"></span></button></main><canvas id="field" aria-label="四轨音游"></canvas>
<header class="floating-header"><a class="logo" href="./"><span class="logo-lines"><i></i><i></i><i></i><i></i></span>NoteLine<span class="logo-dot">.</span></a><button id="play" class="play-button" aria-label="暂停" title="暂停" data-icon="pause"></button></header>
<div class="hud" id="hud" hidden><span id="score">0000000</span><span id="accuracy">100.00%</span></div>
<div class="center-readout" aria-live="off"><div id="countdown"></div><div id="combo"></div><div id="judgement"></div></div>
<div class="stage-stickers" aria-hidden="true"><span class="sticker sticker-star">✦</span><span class="sticker sticker-disc">♪</span></div><div id="idle-hint"><span class="tiny-label">PRESS PLAY, MAKE SOME NOISE!</span><h1>跟着节奏，出发<span>。</span></h1></div>
<div class="lane-inputs" aria-label="四轨触控按键"><button data-lane="0" aria-label="第一轨 D">D</button><button data-lane="1" aria-label="第二轨 F">F</button><button data-lane="2" aria-label="第三轨 J">J</button><button data-lane="3" aria-label="第四轨 K">K</button></div>
<footer class="floating-footer"><span id="track-meta">4 KEY · ORIGINAL</span><span id="time">D F J K · Esc 暂停</span></footer><div class="progress-track"><div id="progress"></div></div>
<section class="floating-panel glass" id="library" hidden><div class="panel-heading"><h2>SONG GALLERY<span>挑一首，开演！</span></h2><div class="menu-tools"><a class="icon-button" href="editor.html" target="_blank" aria-label="打开谱面编辑器" data-icon="edit"></a><button id="menu-settings" aria-controls="settings" aria-expanded="false" class="icon-button" aria-label="菜单设置" data-icon="settings"></button><button class="icon-button small" id="menu-home" aria-label="返回欢迎页" data-icon="arrow"></button></div></div><div class="library-tools"><input id="search" type="search" placeholder="搜索…" aria-label="搜索曲目"><button id="trash-filter" aria-pressed="false" class="icon-button small" aria-label="回收站" title="回收站" data-icon="trash"></button><button id="favorite-filter" aria-pressed="false" class="icon-button small" aria-label="只看收藏" data-icon="heart"></button></div><div id="song-list"></div><div class="gallery-options"><div class="mode-switch liquid-switch" aria-label="谱面难度"><span class="difficulty-indicator" aria-hidden="true"></span><button data-difficulty="easy" aria-pressed="false">简单</button><button data-difficulty="normal" class="active" aria-pressed="true">普通</button><button data-difficulty="hard" aria-pressed="false">困难</button></div><button id="demo-toggle" class="toolbar-button" aria-pressed="false" title="自动演奏当前难度"><span data-icon="play"></span>演示</button><button class="toolbar-button" id="import-toggle" aria-controls="import-form" aria-expanded="false"><span data-icon="plus"></span>导入</button></div><form id="import-form" hidden><label>谱面包 .nlchart（含音乐）<input id="import-chart" type="file" accept=".nlchart,.json" required></label><label id="legacy-audio-field" hidden>旧谱面：补选音乐<input id="import-audio" type="file" accept="audio/*"></label><button class="pill-button" type="submit">加入曲库</button><p id="import-error" class="error"></p></form></section>
<section class="floating-panel glass" id="settings" hidden><div class="panel-heading"><h2>设置</h2><button class="icon-button small" data-close="settings" aria-label="关闭设置" data-icon="close"></button></div><label class="range-label">音量 <output id="volume-value"></output><input id="volume" type="range" min="0" max="100"></label><label class="range-label">下落速度 <output id="speed-value"></output><input id="speed" type="range" min="0.6" max="2.5" step="0.1"></label><label class="range-label">判定偏移 <output id="offset-value"></output><input id="offset" type="range" min="-300" max="300" step="5"></label><label class="check-label">击打音效<input id="hit-sound" type="checkbox" role="switch"></label><div class="setting-note">提前 140–220ms 为 EARLY；EARLY 与 MISS 会断连，空按不影响成绩。</div></section>
<section id="pause-overlay" class="soft-overlay" hidden><div class="pause-card glass"><span class="tiny-label">TAKE YOUR TIME</span><h2>稍作停留</h2><div id="pause-hold-hint" class="small-copy" hidden>恢复倒数时，请重新按住长按或流星所在轨道</div><button id="resume" class="pill-button">继续<span data-icon="play"></span></button><div class="pause-secondary"><button id="restart" class="icon-button" aria-label="重新开始" title="重新开始" data-icon="restart"></button><button id="stop" class="icon-button" aria-label="结束游玩" title="结束游玩" data-icon="close"></button></div></div></section>
<section id="result-overlay" class="soft-overlay" aria-label="游玩结算" hidden></section>
<div id="toast" role="status"></div><audio id="music" preload="auto"></audio><script type="module" src="src/app.js"></script></body></html>
